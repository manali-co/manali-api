[project]
name = "manali-api"
version = "0.1.0"
description = "manali apps backend: subscribers and email, on Azure Functions."
requires-python = ">=3.12"
license = "CC-BY-4.0"
dependencies = [
  "azure-functions>=1.21",
  "fastapi>=0.115",
  "httpx>=0.27",
  "azure-data-tables>=12.5",
  "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manali_api"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
